<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitation bhejein</title>
<link rel="icon" href="art/seal.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  .send{min-height:100svh;background:radial-gradient(circle at 50% 15%,#11535b,#06121f 70%)}
  .send textarea{font-size:1rem}
  .row{display:grid;gap:10px}
  .status{min-height:1.4em;text-align:center;font-style:italic}
</style>
</head>
<body style="--len:{{nameLength}}">
<main class="section send">
  <p class="caps">{{couple}}</p>
  <h1 class="title">Send Invites</h1>
  <p class="sub">Har mehmaan ke naam ka alag card</p>
  <form class="rsvp" id="send">
    <label>Guest ka naam<input name="to" maxlength="70" required placeholder="Sharma ji & Family"></label>
    <label>Message<textarea name="message" rows="8" readonly></textarea></label>
    <div class="row">
      <button class="btn" type="submit">WhatsApp par bhejein</button>
      <button class="btn line" type="button" id="copy">Message copy karein</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </form>
</main>
<script type="application/json" id="data">{{data}}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  const form = document.getElementById('send');
  const { to, message } = form.elements;
  const status = document.getElementById('status');

  function compose() {
    const name = to.value.trim();
    const link = new URL('./', location.href.split(/[?#]/)[0]);
    if (name) link.searchParams.set('to', name);
    message.value = `Dear ${name || 'Guest'},\n\nWith hearts full of joy, we invite you to the wedding of *${data.couple}*.\n\nTap to open your invitation:\n${link.href}`;
  }
  to.addEventListener('input', compose);
  compose();

  if (/^(file:|http:\/\/(localhost|127\.))/.test(location.href))
    status.textContent = 'Yeh local preview hai. Vercel wale link par /send khol kar bhejein.';

  form.addEventListener('submit', e => {
    e.preventDefault();
    location.href = `https://wa.me/?text=${encodeURIComponent(message.value)}`;
  });
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(message.value);
      status.textContent = 'Copy ho gaya';
    } catch {
      message.select();
      status.textContent = 'Message select hai, copy kar lein';
    }
  });
</script>
</body>
</html>
